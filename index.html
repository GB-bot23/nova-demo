<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova — Notes that think with you</title>
  <style>
    :root { --bg:#0a0d1a; --card:#12172b; --ink:#f1f3ff; --muted:#98a0c4; --accent:#8b5cf6; --accent2:#22d3ee; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink); background:radial-gradient(1100px 600px at 75% -10%, #2a2470 0%, var(--bg) 55%); min-height:100vh; }
    .wrap { max-width:760px; margin:0 auto; padding:64px 16px 60px; }
    .logo { font-weight:800; font-size:20px; letter-spacing:-.02em; margin-bottom:48px; }
    .logo span { color:var(--accent2); }
    .badge { display:inline-block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent2);
      background:rgba(34,211,238,.1); border:1px solid rgba(34,211,238,.25); padding:6px 12px; border-radius:999px; margin-bottom:22px; }
    h1 { font-size:clamp(36px,7vw,64px); line-height:1.04; margin:0 0 16px; font-weight:800; letter-spacing:-.03em; overflow-wrap:anywhere; }
    .tagline { font-size:clamp(17px,2.4vw,20px); color:var(--muted); margin:0 0 34px; max-width:560px; }
    .card { background:var(--card); border:1px solid rgba(255,255,255,.07); border-radius:18px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    form { display:flex; flex-wrap:wrap; gap:12px; }
    input { flex:1 1 200px; min-width:0; padding:14px 16px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:#0c1126; color:var(--ink); font-size:15px; }
    input::placeholder { color:#69719a; }
    button { padding:14px 22px; border:0; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; color:#fff;
      background:linear-gradient(135deg,var(--accent),#6366f1); flex:1 1 160px; }
    button:disabled { opacity:.6; cursor:default; }
    .count { margin-top:20px; color:var(--muted); font-size:15px; }
    .count b { color:var(--ink); font-size:22px; }
    .ok { margin-top:14px; color:var(--accent2); font-weight:600; display:none; }
    .list { margin-top:28px; }
    .list h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; }
    .row { display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid rgba(255,255,255,.06); font-size:14px; color:var(--muted); }
    .empty { padding:10px 0; color:#5d6590; font-size:14px; border-top:1px solid rgba(255,255,255,.06); }
    .foot { margin-top:40px; color:#565e88; font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">nova<span>.</span></div>
    <span class="badge">Private beta · waitlist open</span>
    <h1 id="headline">The future of your notes.</h1>
    <p class="tagline">Nova turns scattered thoughts into a second brain. Be first in line when we launch.</p>

    <div class="card">
      <form id="waitlist">
        <input id="name" type="text" placeholder="Your name" required />
        <input id="email" type="email" placeholder="you@email.com" required />
        <button id="submitBtn" type="submit">Join the waitlist</button>
      </form>
      <div class="ok" id="ok">You're on the list! 🎉</div>
      <div class="count"><b id="count">…</b> people already waiting</div>
      <div class="list">
        <h3>Recently joined</h3>
        <div id="recent"></div>
      </div>
    </div>
    <p class="foot">© Nova Labs. Built with Supabase + Vercel.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // Public values from Supabase → Project Settings → API.
    // These ship to every visitor's browser. That's normal — and only safe if RLS is ON.
    const SUPABASE_URL      = "https://rwpyfenkcgoawoqhrbsn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3cHlmZW5rY2dvYXdvcWhyYnNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwODk0NjAsImV4cCI6MjExMDY2NTQ2MH0.PpfkOsyVdQfY0iECEzhQCRQm0ft6CoJ_X32_QbITrAI";

    window.db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);

    async function load() {
      const { data: c } = await db.from("site_content").select("value").eq("key", "headline").maybeSingle();
      if (c) $("headline").textContent = c.value;

      const { count } = await db.from("signups").select("id", { count: "exact", head: true });
      $("count").textContent = count ?? 0;

      const { data: recent } = await db.from("signups").select("name").order("id", { ascending: false }).limit(5);
      $("recent").innerHTML = (recent && recent.length)
        ? recent.map(r => `<div class="row"><span>${(r.name || "Someone").split(" ")[0].replace(/[<>&]/g, "")}</span><span>just joined</span></div>`).join("")
        : `<div class="empty">No one yet — be the first.</div>`;
    }

    $("waitlist").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("submitBtn").disabled = true;
      await db.from("signups").insert({ name: $("name").value, email: $("email").value });
      $("ok").style.display = "block";
      $("name").value = ""; $("email").value = "";
      $("submitBtn").disabled = false;
      load();
    });

    load();
  </script>
</body>
</html>
